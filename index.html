<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>stardust💫出入证生成器 V1.0 测试版</title>
<style>
@font-face {
    font-family: 'FZLTZHK';
    src: url('./fonts/FZLTZHK.woff2') format('woff2');
    font-display: swap;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    overflow-x: hidden;
}

body {
    font-family: 'FZLTZHK', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #9999ff;
    min-height: 100vh;
    position: relative;
    color: #333;
    padding-bottom: 50px;
}

/* 星星动画背景 */
.stars-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}

.star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    opacity: 0.7;
    animation: floatStar linear infinite;
    box-shadow: 0 0 6px #fff;
}

@keyframes floatStar {
    0% { transform: translateY(0) translateX(0); opacity: 0.7; }
    50% { opacity: 1; }
    100% { transform: translateY(-100vh) translateX(30px); opacity: 0; }
}

.container {
    position: relative;
    z-index: 1;
    max-width: 1020px;
    margin: 0 auto;
    padding: 16px;
}

.header {
    text-align: center;
    padding: 16px 0 20px;
}

.header h1 {
    margin: 0;
    font-size: 22px;
    color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.25);
    letter-spacing: 1px;
}

.main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

@media (max-width: 720px) {
    .main-grid {
        grid-template-columns: 1fr;
    }
    .header h1 { font-size: 18px; }
}

.panel {
    background: rgba(255,255,255,0.92);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
}

.panel h2 {
    margin: 0 0 12px;
    font-size: 16px;
    color: #5a4fcf;
    border-bottom: 1px dashed #c4bfff;
    padding-bottom: 8px;
}

.form-row {
    margin-bottom: 12px;
}

.form-row label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 4px;
    font-weight: bold;
}

.form-row input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #c4bfff;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    background: #fff;
}

.form-row input[type="text"]:focus {
    border-color: #5a4fcf;
}

.slider-row {
    margin-bottom: 10px;
}

.slider-row .slider-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: #555;
    margin-bottom: 4px;
}

.slider-row .slider-head span:last-child {
    background: #5a4fcf;
    color: #fff;
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 11px;
    min-width: 40px;
    text-align: center;
}

.slider-row input[type="range"] {
    width: 100%;
    accent-color: #5a4fcf;
}

.upload-btn {
    display: block;
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #5a4fcf, #8a7cf0);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    margin-top: 8px;
    font-weight: bold;
}

.upload-btn:active {
    transform: scale(0.98);
}

.export-btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #ff7b9c, #ff5a7a);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-family: inherit;
    cursor: pointer;
    margin-top: 20px;
    font-weight: bold;
    letter-spacing: 1px;
}

.export-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.preview-wrapper {
    background: rgba(255,255,255,0.95);
    border-radius: 14px;
    padding: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    text-align: center;
}

.preview-wrapper h2 {
    margin: 0 0 10px;
    font-size: 16px;
    color: #5a4fcf;
}

.canvas-box {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    background: #f5f3ff;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #ddd;
}

#mainCanvas {
    width: 100%;
    height: auto;
    display: block;
    touch-action: none;
}

/* 弹窗 */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 100;
    padding: 16px;
}

.modal-overlay.active {
    display: flex;
}

.modal {
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}

.modal h3 {
    margin: 0 0 12px;
    font-size: 17px;
    color: #5a4fcf;
    text-align: center;
}

.modal input {
    width: 100%;
    padding: 11px;
    border: 1.5px solid #c4bfff;
    border-radius: 8px;
    font-size: 16px;
    text-align: center;
    letter-spacing: 4px;
    font-family: inherit;
    outline: none;
}

.modal input:focus {
    border-color: #5a4fcf;
}

.modal-btns {
    display: flex;
    gap: 10px;
    margin-top: 14px;
}

.modal-btn {
    flex: 1;
    padding: 11px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    font-weight: bold;
}

.modal-btn.primary {
    background: #5a4fcf;
    color: #fff;
}

.modal-btn.secondary {
    background: #eee;
    color: #666;
}

.modal-btn.danger {
    background: #ff5a7a;
    color: #fff;
}

.modal .err-msg {
    color: #ff5a7a;
    font-size: 13px;
    text-align: center;
    margin-top: 8px;
    min-height: 18px;
}

.disclaimer-text {
    font-size: 13px;
    line-height: 1.7;
    color: #555;
    background: #fff8f0;
    border: 1px solid #ffd9b3;
    padding: 12px;
    border-radius: 8px;
    margin: 12px 0;
}

.countdown-text {
    text-align: center;
    color: #999;
    font-size: 12px;
    margin-bottom: 6px;
}

/* 裁剪弹窗 */
.cropper-modal {
    max-width: 420px;
    width: 100%;
    background: #1a1a1a;
    color: #fff;
    padding: 14px;
}

.cropper-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 21 / 26;
    background: #000;
    overflow: hidden;
    border-radius: 8px;
    touch-action: none;
    user-select: none;
}

.cropper-stage img {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: center center;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
}

.cropper-frame {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 84%;
    aspect-ratio: 21 / 26;
    border: 2px dashed #fff;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
    border-radius: 4px;
    pointer-events: none;
}

.footer {
    text-align: center;
    color: rgba(255,255,255,0.7);
    font-size: 12px;
    padding: 24px 0 8px;
}

.toast {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    z-index: 200;
    display: none;
}

.toast.show {
    display: block;
    animation: fadeInOut 2.5s;
}

@keyframes fadeInOut {
    0%, 100% { opacity: 0; transform: translateX(-50%) translateY(10px); }
    10%, 90% { opacity: 1; transform: translateX(-50%) translateY(0); }
}
</style>
</head>
<body>

<div class="stars-container" id="starsContainer"></div>

<div class="container">
    <div class="header">
        <h1>stardust💫自动生成器</h1>
    </div>

    <div class="main-grid">
        <!-- 左侧控制面板 -->
        <div class="panel">
            <h2>📝 信息输入</h2>
            <div class="form-row">
                <label>班级</label>
                <input type="text" id="classInput" placeholder="请输入班级" maxlength="30">
            </div>
            <div class="form-row">
                <label>姓名</label>
                <input type="text" id="nameInput" placeholder="请输入姓名" maxlength="20">
            </div>

            <h2 style="margin-top:18px;">🔤 文字参数</h2>
            <div class="slider-row">
                <div class="slider-head"><span>文字缩放</span><span id="textScaleVal">1.00</span></div>
                <input type="range" id="textScale" min="0.5" max="2.0" step="0.02" value="1.00">
            </div>
            <div class="slider-row">
                <div class="slider-head"><span>文字 X 偏移</span><span id="textOffsetXVal">0</span></div>
                <input type="range" id="textOffsetX" min="-100" max="100" step="1" value="0">
            </div>
            <div class="slider-row">
                <div class="slider-head"><span>文字 Y 偏移</span><span id="textOffsetYVal">0</span></div>
                <input type="range" id="textOffsetY" min="-100" max="100" step="1" value="0">
            </div>

            <h2 style="margin-top:18px;">📷 证件头像</h2>
            <button class="upload-btn" id="uploadBtn">上传证件照片</button>

            <div class="slider-row" style="margin-top:12px;">
                <div class="slider-head"><span>头像 X 位置</span><span id="avatarXVal">0</span></div>
                <input type="range" id="avatarX" min="-200" max="200" step="1" value="0">
            </div>
            <div class="slider-row">
                <div class="slider-head"><span>头像 Y 位置</span><span id="avatarYVal">0</span></div>
                <input type="range" id="avatarY" min="-200" max="200" step="1" value="0">
            </div>
            <div class="slider-row">
                <div class="slider-head"><span>头像缩放</span><span id="avatarScaleVal">2.10</span></div>
                <input type="range" id="avatarScale" min="0.5" max="3.5" step="0.02" value="2.10">
            </div>

            <button class="export-btn" id="exportBtn">生成并下载压缩包</button>
        </div>

        <!-- 右侧预览 -->
        <div class="preview-wrapper">
            <h2>👀 实时预览（正面）</h2>
            <div class="canvas-box">
                <canvas id="mainCanvas"></canvas>
            </div>
        </div>
    </div>

    <div class="footer">V1.0 测试版</div>
</div>

<!-- 访问验证弹窗 -->
<div class="modal-overlay active" id="authModal">
    <div class="modal">
        <h3>🔐 访问验证</h3>
        <p style="text-align:center;color:#666;font-size:13px;margin:0 0 12px;">请输入许可码以解锁工具</p>
        <input type="password" id="authInput" placeholder="请输入许可码" inputmode="numeric">
        <div class="err-msg" id="authErr"></div>
        <div class="modal-btns">
            <button class="modal-btn primary" id="authConfirm">确认</button>
        </div>
    </div>
</div>

<!-- 裁剪弹窗 -->
<div class="modal-overlay" id="cropperModal">
    <div class="modal cropper-modal">
        <h3 style="color:#fff;">✂️ 裁剪头像</h3>
        <div class="cropper-stage" id="cropperStage">
            <img id="cropperImg" alt="">
            <div class="cropper-frame"></div>
        </div>
        <p style="color:#aaa;font-size:12px;text-align:center;margin:8px 0 4px;">单指拖动 · 双指捏合缩放</p>
        <div class="modal-btns">
            <button class="modal-btn secondary" id="cropCancel">取消</button>
            <button class="modal-btn primary" id="cropConfirm">确认裁剪</button>
        </div>
    </div>
</div>

<!-- 免责弹窗 -->
<div class="modal-overlay" id="disclaimerModal">
    <div class="modal">
        <h3>⚠️ 免责声明</h3>
        <div class="disclaimer-text" id="disclaimerText">我同意：本工具仅作为模板演示使用，生成内容严禁用于伪造真实证件。如自行使用造成学校处分、处罚或其他后果，全部责任由本人承担，与制作者无关。</div>
        <div class="countdown-text" id="countdownText">倒计时 3 秒后可确认</div>
        <div class="modal-btns">
            <button class="modal-btn secondary" id="disclaimerCancel">取消</button>
            <button class="modal-btn danger" id="disclaimerConfirm" disabled>我同意并导出</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
(function() {
    'use strict';

    // ========== 状态 ==========
    const state = {
        classText: '',
        nameText: '',
        textScale: 1.0,
        textOffsetX: 0,
        textOffsetY: 0,
        avatarImage: null,
        avatarX: 0,
        avatarY: 0,
        avatarScale: 2.1,
        frontImage: null,
        backImage: null
    };

    // 基准坐标（基于横向模板 front.png 1921×1352）
    // 实际会根据 front.png 尺寸自动适配，这里为默认参考值
    const COORDS = {
        classX: 380, classY: 625,
        nameX: 380, nameY: 815,
        avatarX: 1515, avatarY: 560
    };

    const BASE_FONT_SIZE = 72;
    const AVATAR_CROP_W = 210;
    const AVATAR_CROP_H = 260;

    let CANVAS_W = 1921;
    let CANVAS_H = 1352;

    // ========== 元素 ==========
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    const el = (id) => document.getElementById(id);
    const classInput = el('classInput');
    const nameInput = el('nameInput');
    const textScale = el('textScale');
    const textOffsetX = el('textOffsetX');
    const textOffsetY = el('textOffsetY');
    const avatarX = el('avatarX');
    const avatarY = el('avatarY');
    const avatarScale = el('avatarScale');
    const textScaleVal = el('textScaleVal');
    const textOffsetXVal = el('textOffsetXVal');
    const textOffsetYVal = el('textOffsetYVal');
    const avatarXVal = el('avatarXVal');
    const avatarYVal = el('avatarYVal');
    const avatarScaleVal = el('avatarScaleVal');

    // ========== 工具函数 ==========
    function showToast(msg) {
        const t = el('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => t.classList.remove('show'), 2400);
    }

    function loadImage(src) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error('加载失败: ' + src));
            img.src = src;
        });
    }

    function resizeCanvasTo(w, h) {
        CANVAS_W = w;
        CANVAS_H = h;
        canvas.width = w;
        canvas.height = h;
        render();
    }

    // ========== 星星背景 ==========
    function createStars() {
        const c = el('starsContainer');
        const count = window.innerWidth < 600 ? 30 : 60;
        for (let i = 0; i < count; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            const size = Math.random() * 3 + 1;
            s.style.width = size + 'px';
            s.style.height = size + 'px';
            s.style.left = Math.random() * 100 + '%';
            s.style.top = (Math.random() * 100 + 100) + '%';
            s.style.animationDuration = (Math.random() * 8 + 6) + 's';
            s.style.animationDelay = (Math.random() * 8) + 's';
            c.appendChild(s);
        }
    }
    createStars();

    // ========== 加载模板 ==========
    function loadTemplates() {
        Promise.all([
            loadImage('./front.png').catch(() => null),
            loadImage('./back.png').catch(() => null)
        ]).then(([f, b]) => {
            state.frontImage = f;
            state.backImage = b;
            if (f) {
                // 以 front.png 实际尺寸作为画布尺寸
                resizeCanvasTo(f.naturalWidth, f.naturalHeight);
            } else {
                showToast('⚠️ 未找到 front.png，请上传至同目录');
                resizeCanvasTo(1921, 1352);
            }
        });
    }

    // ========== 渲染 ==========
    function render() {
        ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

        // 模板
        if (state.frontImage) {
            ctx.drawImage(state.frontImage, 0, 0, CANVAS_W, CANVAS_H);
        } else {
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
            ctx.fillStyle = '#999';
            ctx.font = '24px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('请上传 front.png', CANVAS_W/2, CANVAS_H/2);
        }

        // 文字
        ctx.fillStyle = '#222';
        ctx.textBaseline = 'middle';

        const finalFontSize = BASE_FONT_SIZE * state.textScale;
        ctx.font = `${finalFontSize}px 'FZLTZHK', 'Microsoft YaHei', sans-serif`;
        ctx.textAlign = 'left';

        const classX = COORDS.classX + state.textOffsetX;
        const classY = COORDS.classY + state.textOffsetY;
        const nameX = COORDS.nameX + state.textOffsetX;
        const nameY = COORDS.nameY + state.textOffsetY;

        ctx.fillText(state.classText, classX, classY);
        ctx.fillText(state.nameText, nameX, nameY);

        // 头像
        if (state.avatarImage) {
            const ax = COORDS.avatarX + state.avatarX;
            const ay = COORDS.avatarY + state.avatarY;
            const img = state.avatarImage;
            const w = img.width * state.avatarScale;
            const h = img.height * state.avatarScale;
            ctx.drawImage(img, ax - w/2, ay - h/2, w, h);
        }
    }

    // ========== 事件绑定 ==========
    classInput.addEventListener('input', () => {
        state.classText = classInput.value;
        render();
    });
    nameInput.addEventListener('input', () => {
        state.nameText = nameInput.value;
        render();
    });

    function bindSlider(slider, label, key, formatter) {
        slider.addEventListener('input', () => {
            const v = parseFloat(slider.value);
            state[key] = v;
            label.textContent = formatter ? formatter(v) : v;
            render();
        });
    }
    bindSlider(textScale, textScaleVal, 'textScale', v => v.toFixed(2));
    bindSlider(textOffsetX, textOffsetXVal, 'textOffsetX', v => v.toFixed(0));
    bindSlider(textOffsetY, textOffsetYVal, 'textOffsetY', v => v.toFixed(0));
    bindSlider(avatarX, avatarXVal, 'avatarX', v => v.toFixed(0));
    bindSlider(avatarY, avatarYVal, 'avatarY', v => v.toFixed(0));
    bindSlider(avatarScale, avatarScaleVal, 'avatarScale', v => v.toFixed(2));

    // ========== 验证弹窗 ==========
    const authModal = el('authModal');
    const authInput = el('authInput');
    const authErr = el('authErr');
    el('authConfirm').addEventListener('click', () => {
        if (authInput.value.trim() === '20100812') {
            authModal.classList.remove('active');
            authErr.textContent = '';
        } else {
            authErr.textContent = '❌ 许可码错误，请重新输入';
            authInput.value = '';
            authInput.focus();
        }
    });
    authInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') el('authConfirm').click();
    });
    setTimeout(() => authInput.focus(), 200);

    // ========== 头像上传与裁剪 ==========
    let cropperImg = null;
    const cropperModal = el('cropperModal');
    const cropperStage = el('cropperStage');
    const cropperImgEl = el('cropperImg');

    el('uploadBtn').addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => openCropper(img);
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        };
        input.click();
    });

    function openCropper(img) {
        cropperImg = img;
        cropperImgEl.src = img.src;

        cropperImgEl.style.transform = 'translate(-50%, -50%) scale(1)';
        cropperState.scale = 1;
        cropperState.tx = 0;
        cropperState.ty = 0;
        applyCropperTransform();

        // 计算初始缩放（让图片覆盖裁剪框）
        requestAnimationFrame(() => {
            const stageRect = cropperStage.getBoundingClientRect();
            const frameW = stageRect.width * 0.84;
            const frameH = frameW * (AVATAR_CROP_H / AVATAR_CROP_W);
            const scale = Math.max(frameW / img.width, frameH / img.height);
            cropperState.scale = scale;
            cropperState.tx = 0;
            cropperState.ty = 0;
            applyCropperTransform();
        });

        cropperModal.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    el('cropCancel').addEventListener('click', () => {
        cropperModal.classList.remove('active');
        document.body.style.overflow = '';
    });

    el('cropConfirm').addEventListener('click', () => {
        if (!cropperImg) return;
        const resultCanvas = document.createElement('canvas');
        resultCanvas.width = AVATAR_CROP_W;
        resultCanvas.height = AVATAR_CROP_H;
        const rctx = resultCanvas.getContext('2d');

        const stageRect = cropperStage.getBoundingClientRect();
        const frameW = stageRect.width * 0.84;
        const frameH = frameW * (AVATAR_CROP_H / AVATAR_CROP_W);
        const scaleX = AVATAR_CROP_W / frameW;
        const scaleY = AVATAR_CROP_H / frameH;

        rctx.save();
        rctx.translate(AVATAR_CROP_W/2, AVATAR_CROP_H/2);
        rctx.scale(cropperState.scale * scaleX, cropperState.scale * scaleY);
        rctx.translate(cropperState.tx, cropperState.ty);
        rctx.drawImage(cropperImg, -cropperImg.width/2, -cropperImg.height/2);
        rctx.restore();

        const finalImg = new Image();
        finalImg.onload = () => {
            state.avatarImage = finalImg;
            cropperModal.classList.remove('active');
            document.body.style.overflow = '';
            render();
            showToast('✅ 头像已更新');
        };
        finalImg.src = resultCanvas.toDataURL('image/png');
    });

    // ========== 裁剪手势 ==========
    const cropperState = { scale: 1, tx: 0, ty: 0, startScale: 1, startTx: 0, startTy: 0 };
    let pinchStartDist = 0;

    function getTouchDist(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.hypot(dx, dy);
    }

    function getTouchCenter(touches) {
        return {
            x: (touches[0].clientX + touches[1].clientX) / 2,
            y: (touches[0].clientY + touches[1].clientY) / 2
        };
    }

    function applyCropperTransform() {
        cropperImgEl.style.transform = `translate(calc(-50% + ${cropperState.tx}px), calc(-50% + ${cropperState.ty}px)) scale(${cropperState.scale})`;
    }

    cropperStage.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (e.touches.length === 1) {
            const t = e.touches[0];
            cropperState.startTx = cropperState.tx;
            cropperState.startTy = cropperState.ty;
            cropperState._startX = t.clientX;
            cropperState._startY = t.clientY;
        } else if (e.touches.length === 2) {
            pinchStartDist = getTouchDist(e.touches);
            cropperState.startScale = cropperState.scale;
            const c = getTouchCenter(e.touches);
            cropperState._pinchCx = c.x;
            cropperState._pinchCy = c.y;
        }
    }, { passive: false });

    cropperStage.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (e.touches.length === 1 && cropperState._startX !== undefined) {
            const t = e.touches[0];
            cropperState.tx = cropperState.startTx + (t.clientX - cropperState._startX);
            cropperState.ty = cropperState.startTy + (t.clientY - cropperState._startY);
            applyCropperTransform();
        } else if (e.touches.length === 2 && pinchStartDist > 0) {
            const d = getTouchDist(e.touches);
            const ratio = d / pinchStartDist;
            cropperState.scale = Math.max(0.2, Math.min(5, cropperState.startScale * ratio));
            applyCropperTransform();
        }
    }, { passive: false });

    cropperStage.addEventListener('touchend', (e) => {
        if (e.touches.length === 0) {
            cropperState._startX = undefined;
            cropperState._startY = undefined;
            pinchStartDist = 0;
        } else if (e.touches.length === 1) {
            const t = e.touches[0];
            cropperState.startTx = cropperState.tx;
            cropperState.startTy = cropperState.ty;
            cropperState._startX = t.clientX;
            cropperState._startY = t.clientY;
            cropperState.startScale = cropperState.scale;
            pinchStartDist = 0;
        }
    });

    // 鼠标拖动支持（PC 调试用）
    let mouseDown = false;
    cropperStage.addEventListener('mousedown', (e) => {
        mouseDown = true;
        cropperState.startTx = cropperState.tx;
        cropperState.startTy = cropperState.ty;
        cropperState._mouseX = e.clientX;
        cropperState._mouseY = e.clientY;
    });
    cropperStage.addEventListener('mousemove', (e) => {
        if (!mouseDown) return;
        cropperState.tx = cropperState.startTx + (e.clientX - cropperState._mouseX);
        cropperState.ty = cropperState.startTy + (e.clientY - cropperState._mouseY);
        applyCropperTransform();
    });
    cropperStage.addEventListener('mouseup', () => mouseDown = false);
    cropperStage.addEventListener('mouseleave', () => mouseDown = false);
    cropperStage.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = -e.deltaY * 0.001;
        cropperState.scale = Math.max(0.2, Math.min(5, cropperState.scale * (1 + delta)));
        applyCropperTransform();
    }, { passive: false });

    // ========== 免责弹窗 & 导出 ==========
    const disclaimerModal = el('disclaimerModal');
    const countdownText = el('countdownText');
    const disclaimerConfirm = el('disclaimerConfirm');
    const exportBtn = el('exportBtn');
    let countdownTimer = null;

    exportBtn.addEventListener('click', () => {
        if (!state.frontImage) {
            showToast('⚠️ 请先确保 front.png 已上传');
            return;
        }
        if (!state.avatarImage) {
            if (!confirm('尚未上传头像，确定继续导出吗？')) return;
        }
        disclaimerModal.classList.add('active');
        let n = 3;
        countdownText.textContent = `倒计时 ${n} 秒后可确认`;
        disclaimerConfirm.disabled = true;
        clearInterval(countdownTimer);
        countdownTimer = setInterval(() => {
            n--;
            if (n <= 0) {
                clearInterval(countdownTimer);
                countdownText.textContent = '✅ 可以确认';
                disclaimerConfirm.disabled = false;
            } else {
                countdownText.textContent = `倒计时 ${n} 秒后可确认`;
            }
        }, 1000);
    });

    el('disclaimerCancel').addEventListener('click', () => {
        clearInterval(countdownTimer);
        disclaimerModal.classList.remove('active');
    });

    disclaimerConfirm.addEventListener('click', () => {
        clearInterval(countdownTimer);
        disclaimerModal.classList.remove('active');
        doExport();
    });

    async function doExport() {
        showToast('正在生成压缩包...');
        try {
            const zip = new JSZip();

            // 导出正面
            canvas.toBlob(async (blob) => {
                zip.file('出入证_正面.png', blob);

                // 加载背面
                const backBlob = await fetch('./back.png').then(r => r.blob()).catch(() => null);
                if (backBlob) {
                    zip.file('出入证_背面.png', backBlob);
                } else {
                    // 未找到 back.png，生成与正面同尺寸空白占位
                    const tmp = document.createElement('canvas');
                    tmp.width = CANVAS_W;
                    tmp.height = CANVAS_H;
                    const tctx = tmp.getContext('2d');
                    tctx.fillStyle = '#fff';
                    tctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
                    tctx.fillStyle = '#999';
                    tctx.textAlign = 'center';
                    tctx.textBaseline = 'middle';
                    tctx.font = '24px sans-serif';
                    tctx.fillText('请自行替换为 back.png', CANVAS_W/2, CANVAS_H/2);
                    zip.file('出入证_背面.png', await new Promise(r => tmp.toBlob(r)));
                }

                // 使用说明
                const readme = `出入证使用说明
========================

打印尺寸：100mm × 65mm
制作者：xytwuming💫
版本：V1.0 测试版

------------------------
本工具仅作为模板演示使用
严禁用于伪造真实证件
`;
                zip.file('使用说明.txt', readme);

                const content = await zip.generateAsync({ type: 'blob' });
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = '出入证_' + Date.now() + '.zip';
                a.click();
                URL.revokeObjectURL(url);
                showToast('✅ 已导出压缩包');
            }, 'image/png');
        } catch (err) {
            console.error(err);
            showToast('❌ 导出失败: ' + err.message);
        }
    }

    // ========== 初始化 ==========
    loadTemplates();
    render();

    // 防止页面整体滑动干扰弹窗
    document.addEventListener('touchmove', (e) => {
        if (cropperModal.classList.contains('active')) {
            if (!cropperStage.contains(e.target)) e.preventDefault();
        }
    }, { passive: false });

})();
</script>
</body>
